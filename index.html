<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UNISWAP 风格主页 — 黑底粉字</title>
  <meta name="description" content="黑底粉字的 UNISWAP 风格静态主页，包含标题与 SVG Logo，可直接保存为 HTML 并部署。" />
  <style>
    :root{
      --bg:#000000;
      --pink:#FF007A;
      --glass: rgba(255,255,255,0.02);
      --max-w:1100px;
    }
    html,body{height:100%;}
    body{
      margin:0;
      font-family: Inter, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(180deg,var(--bg), #070707 120px);
      color:var(--pink);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }
    .site{
      width:100%;
      max-width:var(--max-w);
      display:grid;
      grid-template-columns: 320px 1fr;
      gap:32px;
      align-items:center;
    }
    /* card */
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.04);
      padding:28px;
      border-radius:18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    /* logo area */
    .logo-wrap{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .logo-box{
      width:120px;
      height:120px;
      min-width:120px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:20px;
      background: radial-gradient(circle at 30% 30%, rgba(255,0,122,0.08), transparent 30%), var(--glass);
      border: 1px solid rgba(255,0,122,0.08);
    }

    h1{
      margin:0;
      font-size:36px;
      line-height:1.05;
      font-weight:800;
      letter-spacing:2px;
      color:var(--pink);
      text-transform:uppercase;
    }
    .tagline{
      margin-top:8px;
      color:rgba(255,0,122,0.9);
      font-weight:500;
      opacity:0.9;
    }

    /* right column */
    .hero{
      padding:22px 26px;
    }
    .lead{
      font-size:18px;
      color:rgba(255,0,122,0.95);
      margin-bottom:16px;
      max-width:680px;
    }

    .cta-row{
      display:flex;
      gap:12px;
      margin-top:20px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 18px;
      border-radius:12px;
      font-weight:700;
      letter-spacing:1px;
      border: 1px solid rgba(255,0,122,0.12);
      background: transparent;
      color:var(--pink);
      cursor:pointer;
      text-decoration:none;
    }
    .btn--primary{
      background: linear-gradient(90deg, rgba(255,0,122,0.14), rgba(255,0,122,0.06));
      box-shadow: 0 6px 18px rgba(255,0,122,0.06);
    }

    /* footer */
    .foot{
      margin-top:18px;
      font-size:13px;
      color:rgba(255,255,255,0.12);
    }

    /* responsive */
    @media (max-width:880px){
      .site{grid-template-columns: 1fr;}
      .logo-box{width:96px;height:96px;min-width:96px;border-radius:14px}
      h1{font-size:28px}
    }
  </style>
</head>
<body>
  <main class="site">
    <!-- 左侧：Logo 卡片 -->
    <section class="card" aria-labelledby="site-title">
      <div class="logo-wrap">
        <div class="logo-box" aria-hidden="true">
          <!-- 自定义 SVG Logo（黑底 + 粉色线条） -->
          <svg width="84" height="84" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="UNISWAP 风格 Logo">
            <rect width="64" height="64" fill="#0A0A0A" rx="12" />
            <!-- 抽象角形/曲线，粉色描边 -->
            <g transform="translate(6,6) scale(0.85)">
              <path d="M6 34 C14 18, 34 14, 44 8" fill="none" stroke="#FF007A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M44 8 L50 2 L46 12 Z" fill="#FF007A" />
              <!-- 圆环带，像 Uniswap 的简化标志 -->
              <path d="M18 44 A14 14 0 1 0 46 44" fill="none" stroke="#FF007A" stroke-width="2.4" stroke-linecap="round" />
            </g>
          </svg>
        </div>

        <div>
          <h1 id="site-title">UNISWAP STYLE</h1>
          <div class="tagline">黑底 • 粉字 • 简洁风格</div>
        </div>
      </div>

      <p class="foot">这是一个静态演示页的 Logo 区块，可直接保存为 HTML 并部署到 GitHub Pages / Cloudflare Pages。</p>
    </section>

    <!-- 右侧：简介与 CTA -->
    <section class="card hero" aria-labelledby="hero-title">
      <h2 id="hero-title" style="margin:0;color:var(--pink);font-size:20px;letter-spacing:1px;">欢迎来到 Uniswap 风格主页</h2>
            <div class="cta-row">
        <a class="btn btn--primary" href="#" onclick="alert('这是示例按钮 — 替换为有效链接');return false;">立即使用</a>
        <a class="btn" href="#" onclick="alert('另一个示例操作');return false;">学习更多</a>
      </div>

      <p class="foot">想要我把这个页面拆成单独的 CSS 文件，或帮你把 Logo 换成更接近真实 Uniswap 的独角兽图标吗？回复我你的偏好，我会立刻修改。</p>
    </section>
  </main>
</body>
</html>
